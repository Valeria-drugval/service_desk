{% extends 'helpdesk/base.html' %}

{% block page_title %}Создание заявки{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-body-tertiary py-3">
                <h5 class="mb-0 fw-bold"><i class="fas fa-plus-circle text-primary me-2"></i> Новая заявка</h5>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-bold">Тема заявки</label>
                        <input type="text" name="title" class="form-control form-control-lg" placeholder="Например: Не работает принтер" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Категория</label>
                        <select name="category" class="form-select form-select-lg">
                            <option value="">Выберите категорию...</option>
                            {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Описание проблемы</label>
                        <textarea name="description" class="form-control" rows="6" placeholder="Опишите подробно, что случилось..." required></textarea>
                    </div>
                    <div class="d-flex justify-content-end gap-2">
                        <a href="{% url 'request_list' %}" class="btn btn-light border">Отмена</a>
                        <button type="submit" class="btn btn-primary px-4"><i class="fas fa-paper-plane me-2"></i> Отправить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
